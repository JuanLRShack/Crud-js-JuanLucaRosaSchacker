<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Classificador de Pokémon</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

    <script src='index.js'></script>
  </head>
  <body class="bg-light">

    <!-- Banner: capa.jpg fica ao fundo, atrás do título -->
    <div class="p-5 text-white text-center shadow mb-4 d-flex align-items-center" style="min-height: 280px; background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('capa.jpg') center / cover no-repeat;">
      <div class="container">
        <h1 class="display-4 font-weight-bold mb-2" style="text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);">
          <span class="mr-2">⚡</span>Classificador de Pokémon
        </h1>
        <p class="lead font-italic mb-0" style="text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);">Cadastre e organize seus Pokémon por nome, tipo e gênero</p>
        <hr class="my-3" style="opacity: 0.2; border-color: rgba(255, 255, 255, 0.2);">
        <span class="badge badge-pill badge-light px-3 py-2 font-weight-bold text-dark">CRUD: JS + Bootstrap 4</span>
      </div>
    </div>

    <div class="container">
      <div class="row">
        
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white font-weight-bold">
              Novo Pokémon
            </div>
            <div class="card-body" id='create-work'>
              <form id="work-form">
                
                <div class="form-group">
                  <label for="name" class="small font-weight-bold text-muted">Nome</label>
                  <input type="text" class="form-control" id="name" placeholder="Ex: Garchomp" required>
                </div>

                <div class="form-group">
                  <label for="type" class="small font-weight-bold text-muted">Tipo</label>
                  <input type="text" class="form-control" id="type" placeholder="Ex: Dragão / Terra" required>
                </div>

                <div class="form-group">
                  <label for="gender" class="small font-weight-bold text-muted">Gênero fixo</label>
                  <select class="form-control" id="gender" required>
                    <option value="Sem gênero fixo">Sem gênero fixo</option>
                    <option value="Sempre macho">Sempre macho ♂</option>
                    <option value="Sempre fêmea">Sempre fêmea ♀</option>
                    <option value="Sem gênero">Sem gênero (assexuado)</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="image" class="small font-weight-bold text-muted">URL da Foto</label>
                  <input type="url" class="form-control" id="image" placeholder="https://..." required>
                </div>

                <button type="submit" class="btn btn-success btn-block shadow-sm">Adicionar Pokémon 🚀</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <h3 class="h5 mb-3 text-secondary font-weight-bold">Pokémon Cadastrados</h3>
          
          <div class="row" id='work-container'>
            
            </div>
        </div>

      </div>
    </div>
    <footer class="bg-dark text-white-50 py-4 mt-5 border-top border-secondary">
      <div class="container text-center">
        <p class="mb-1 text-white font-weight-bold">⚡ Classificador de Pokémon</p>
        <small class="d-block">
          Copyright &copy; 2026. Professora Lara Popov Zambiasi Bazzi Oberderfer.
        </small>
        <div class="mt-2">
          <span class="badge badge-secondary p-2">IFSC Câmpus Chapecó</span>
        </div>
      </div>
    </footer>
    
  </body>
</html>
